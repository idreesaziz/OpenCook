[project]
name = "opencook"
version = "0.1.0"
description = "An open-source search engine for chemical synthesis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "typer>=0.15,<1",
  "pydantic>=2.10,<3", "rdkit>=2025.3", "httpx>=0.28,<1"
]

[project.optional-dependencies]
ord = ["ord-schema[huggingface]>=0.8.3,<0.9"]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
opencook = "opencook.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["opencook"]
follow_imports = "skip"
exclude = ["opencook/chemistry.py", "opencook/cli.py", "opencook/api.py", "opencook/ord_import.py"]
