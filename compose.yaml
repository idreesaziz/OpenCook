services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    environment:
      OPENCOOK_AVAILABILITY_URL: http://availability:8787
  availability:
    build: ../AvailEvidence
    profiles: ["availability"]
    ports: ["8787:8787"]
    environment:
      AVAILEVIDENCE_DB: /data/availevidence.db
    volumes: ["availability-data:/data"]
  postgres:
    image: informaticsmatters/rdkit-cartridge-debian:Release_2025_03
    profiles: ["full"]
    environment:
      POSTGRES_DB: opencook
      POSTGRES_USER: opencook
      POSTGRES_PASSWORD: local-development-only
    volumes: ["opencook-pg:/var/lib/postgresql/data"]
volumes:
  opencook-pg:
  availability-data:
